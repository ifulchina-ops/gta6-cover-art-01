<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Nights — GTA 6 Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Leonida Nights</h1>
    <p class="tagline">Your photos, dealt into a Vice City poster.</p>

    <label>Your photo <input id="photo" type="file" accept="image/*"></label>

    <fieldset class="samples">
      <legend>Or place a sample in the selected panel</legend>
      <button type="button" data-sample="neon"><img src="samples/neon.jpg" alt="Neon boulevard"><span>Neon</span></button>
      <button type="button" data-sample="speedboat"><img src="samples/speedboat.jpg" alt="Speedboat at sunset"><span>Boat</span></button>
      <button type="button" data-sample="muscle"><img src="samples/muscle.jpg" alt="Muscle car on Ocean Drive"><span>Muscle</span></button>
      <button type="button" data-sample="lifeguard"><img src="samples/lifeguard.jpg" alt="Lifeguard tower"><span>Beach</span></button>
    </fieldset>

    <label>Caption <input id="caption" type="text" maxlength="32" value="Leonida Nights"></label>
    <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="welcome back to Vice City"></label>

    <label>Layout
      <select id="layout">
        <option value="grid" selected>Grid — four panels</option>
        <option value="strips">Strips — three film bands</option>
        <option value="hero">Hero — one big photo</option>
      </select>
    </label>
    <label>Grade
      <select id="grade">
        <option value="gold" selected>Vice Gold</option>
        <option value="neon">Neon Night</option>
        <option value="sunset">Sunset</option>
      </select>
    </label>
    <label>Size
      <select id="size">
        <option value="square" selected>Square 1080 x 1080</option>
        <option value="portrait">Portrait 1080 x 1350</option>
        <option value="wide">Wide 1920 x 1080</option>
      </select>
    </label>

    <label>Zoom the selected panel <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
    <p id="panel-hint" class="hint">Panel 1 of 4 selected — drag it to crop, or pick its photo above.</p>
    <div class="row">
      <button id="reset-crop" type="button">Reset crop</button>
      <button id="auto-deal" type="button">Auto-deal panels</button>
    </div>

    <button id="export" type="button" class="export">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
